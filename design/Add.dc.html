<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; text-decoration: none; } a:hover { color: #047857; }
    .fig { font-family: 'Source Code Pro', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .key { height: 60px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center; justify-content: center; font-family: 'Source Code Pro', ui-monospace, monospace; font-size: 22px; font-weight: 500; color: #0B0F17; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F7F9; color: #0B0F17; display: flex; flex-direction: column; overflow: hidden;">

  <!-- header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 16px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </div>
    <div style="font-size: 15px; font-weight: 600;">New transaction</div>
    <div style="width: 44px;"></div>
  </div>

  <!-- amount: the first and biggest thing -->
  <div style="padding: 10px 24px 0 24px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <div class="fig" style="display: flex; align-items: baseline; gap: 5px;">
      <span style="font-size: 22px; font-weight: 500; color: #94a3b8;">GH&#8373;</span>
      <span style="font-size: 52px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05;">184</span>
      <span style="font-size: 52px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; color: #94a3b8;">.50</span>
      <span style="width: 2px; height: 42px; background: #10B981; margin-left: 2px;"></span>
    </div>
    <div style="font-size: 12px; color: #94a3b8;">Expenses &middot; Food</div>
  </div>

  <!-- group segmented control -->
  <div style="margin: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #94a3b8;">GROUP</div>
    <div style="display: flex; gap: 6px;">
      <div style="flex-grow: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #475569;">Income</div>
      <div style="flex-grow: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #475569;">Bills</div>
      <div style="flex-grow: 1; height: 34px; border-radius: 10px; background: #0B0F17; border: 1px solid #0B0F17; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #FFFFFF;">Expenses</div>
      <div style="flex-grow: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #475569;">Savings</div>
      <div style="flex-grow: 1; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #475569;">Debt</div>
    </div>
  </div>

  <!-- category chips -->
  <div style="margin: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #94a3b8;">CATEGORY</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #10B981; display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
        <span style="font-size: 13px; font-weight: 600; color: #FFFFFF;">Food</span>
      </div>
      <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center;">
        <span style="font-size: 13px; font-weight: 500; color: #475569;">Transport</span>
      </div>
      <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center;">
        <span style="font-size: 13px; font-weight: 500; color: #475569;">Health</span>
      </div>
      <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E8EAED; display: flex; align-items: center;">
        <span style="font-size: 13px; font-weight: 500; color: #475569;">Tithe</span>
      </div>
    </div>
  </div>

  <!-- date + note, collapsed to one row each -->
  <div style="margin: 16px 16px 0 16px; background: #FFFFFF; border: 1px solid #E8EAED; border-radius: 12px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"></rect><path d="M3.5 10h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
      <span style="font-size: 13px; color: #475569; flex-grow: 1;">Today, 13 Sep</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </div>
    <div style="height: 1px; background: #F0F2F4;"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h9"></path></svg>
      <span style="font-size: 13px; color: #94a3b8; flex-grow: 1;">Add a note</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- keypad -->
  <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key">.</div>
    <div class="key">0</div>
    <div class="key">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9L3 12l6 7h11a1 1 0 001-1V6a1 1 0 00-1-1z"></path><path d="M16 9l-5 6"></path><path d="M11 9l5 6"></path></svg>
    </div>
  </div>

  <!-- save -->
  <div style="padding: 12px 16px 20px 16px;">
    <div style="height: 54px; border-radius: 15px; background: #10B981; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 16px; font-weight: 600; color: #FFFFFF;">Save transaction</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
